<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>designer · 交付台</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b0e;
      --fg: #f5f2eb;
      --muted: #9aa3af;
      --accent: #7dd3c0;
      --accent-2: #f0b27a;
      --card: #12161c;
      --line: rgba(245,242,235,.10);
      --ok: #7dd3c0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "SF Pro Text", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      background:
        radial-gradient(900px 480px at 0% -10%, #1a2c34 0%, transparent 60%),
        radial-gradient(700px 420px at 100% 0%, #2a1d2f 0%, transparent 55%),
        var(--bg);
      color: var(--fg);
    }
    .wrap { width: min(920px, calc(100% - 32px)); margin: 0 auto; padding: 36px 0 64px; }
    header {
      display: flex; flex-wrap: wrap; gap: 16px 24px;
      justify-content: space-between; align-items: flex-start;
      margin-bottom: 28px;
    }
    .brand .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--accent); font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
      margin-bottom: 10px;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--ok);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 22%, transparent);
      animation: pulse 2.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 22%, transparent); }
      50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--ok) 8%, transparent); }
    }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 4vw, 36px); font-weight: 650; letter-spacing: -.02em; }
    .subtitle { margin: 0; color: var(--muted); line-height: 1.6; max-width: 46ch; }
    .status {
      border: 1px solid var(--line); background: color-mix(in srgb, var(--card) 80%, transparent);
      border-radius: 16px; padding: 14px 16px; min-width: 180px;
    }
    .status dt { color: var(--muted); font-size: 12px; margin: 0 0 4px; }
    .status dd { margin: 0 0 10px; font-size: 14px; }
    .status dd:last-child { margin-bottom: 0; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      margin: 0 0 18px; color: var(--muted); font-size: 13px;
    }
    .chip {
      border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px;
      background: color-mix(in srgb, var(--card) 70%, transparent);
    }
    .feed { display: grid; gap: 14px; }
    .card {
      display: grid; grid-template-columns: 88px 1fr auto; gap: 16px; align-items: center;
      padding: 18px; border-radius: 20px; text-decoration: none; color: inherit;
      background: color-mix(in srgb, var(--card) 92%, transparent);
      border: 1px solid var(--line);
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }
    .card:hover {
      transform: translateY(-1px);
      border-color: color-mix(in srgb, var(--accent) 35%, var(--line));
      background: color-mix(in srgb, var(--card) 100%, #1a222b);
    }
    .thumb {
      width: 88px; height: 72px; border-radius: 14px;
      display: grid; place-items: center; font-size: 12px; letter-spacing: .04em;
      background: linear-gradient(145deg, #1d2731, #151a21);
      border: 1px solid var(--line); color: var(--accent); text-transform: uppercase;
      overflow: hidden;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .body h2 { margin: 0 0 6px; font-size: 17px; font-weight: 600; }
    .body p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .tag {
      font-size: 11px; color: var(--muted); border: 1px solid var(--line);
      border-radius: 999px; padding: 2px 8px;
    }
    .meta { text-align: right; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .meta .badge {
      display: inline-block; margin-bottom: 8px; padding: 3px 8px; border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent);
      border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent);
    }
    .empty {
      border: 1px dashed var(--line); border-radius: 20px; padding: 36px 20px;
      text-align: center; color: var(--muted);
    }
    footer {
      margin-top: 28px; color: var(--muted); font-size: 12px; line-height: 1.6;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px; background: color-mix(in srgb, var(--fg) 8%, transparent);
      padding: 1px 6px; border-radius: 6px; color: var(--fg);
    }
    @media (max-width: 720px) {
      .card { grid-template-columns: 72px 1fr; }
      .meta { grid-column: 2; text-align: left; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="eyebrow"><span class="dot"></span> Delivery live</div>
        <h1 id="title">designer · 交付台</h1>
        <p class="subtitle" id="subtitle">视觉稿、原型和演示都先挂在这里。</p>
      </div>
      <dl class="status">
        <dt>状态</dt>
        <dd id="live">在线</dd>
        <dt>最近更新</dt>
        <dd id="updated">—</dd>
      </dl>
    </header>

    <div class="toolbar">
      <span class="chip" id="count">0 条交付</span>
      <span class="chip">给 Ge Yate</span>
      <span class="chip">由 designer 维护</span>
    </div>

    <section class="feed" id="feed" aria-live="polite"></section>
    <footer>
      这是 designer 的固定交付通道。聊天里我会同步最新链接；如果隧道重启导致域名变化，以聊天里最新一条为准。
      本地清单：<code>deliveries.json</code>
    </footer>
  </div>

  <script>
    const typeLabel = {
      note: 'Note',
      image: 'Image',
      html: 'HTML',
      prototype: 'Proto',
      video: 'Video',
      file: 'File'
    };

    function fmt(iso) {
      try {
        return new Date(iso).toLocaleString('zh-CN', { hour12: false });
      } catch {
        return iso || '—';
      }
    }

    async function boot() {
      const res = await fetch('./deliveries.json?ts=' + Date.now(), { cache: 'no-store' });
      const data = await res.json();
      document.getElementById('title').textContent = data.site?.title || 'designer · 交付台';
      document.getElementById('subtitle').textContent = data.site?.subtitle || '';
      document.getElementById('updated').textContent = fmt(data.updatedAt);
      const items = Array.isArray(data.items) ? data.items : [];
      document.getElementById('count').textContent = items.length + ' 条交付';
      const feed = document.getElementById('feed');
      if (!items.length) {
        feed.innerHTML = '<div class="empty">还没有交付。下一份视觉结果会出现在这里。</div>';
        return;
      }
      feed.innerHTML = items.map((item) => {
        const thumb = item.thumb
          ? `<div class="thumb"><img src="${item.thumb}" alt="" /></div>`
          : `<div class="thumb">${typeLabel[item.type] || item.type || 'Item'}</div>`;
        const tags = (item.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
        const href = item.href || '#';
        return `
          <a class="card" href="${href}">
            ${thumb}
            <div class="body">
              <h2>${item.title || '未命名交付'}</h2>
              <p>${item.summary || ''}</p>
              ${tags ? `<div class="tags">${tags}</div>` : ''}
            </div>
            <div class="meta">
              <div class="badge">${item.status || 'ready'}</div>
              <div>${fmt(item.createdAt)}</div>
            </div>
          </a>`;
      }).join('');
    }

    boot().catch((err) => {
      document.getElementById('feed').innerHTML =
        `<div class="empty">加载失败：${String(err)}</div>`;
    });
  </script>
</body>
</html>
